name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps and run tests
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/unit/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend typecheck
        run: |
          cd frontend
          npm install
          npm run typecheck

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/memory-system
            git pull origin main
            source .venv/bin/activate
            pip install -e ".[dev]"
            sudo systemctl restart memsys-api
            cd frontend
            npm install
            npm run build
            sudo systemctl restart memsys-frontend