[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-system"
version = "0.1.0"
description = "Persistent conversational-memory layer behind an LLM chat agent"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg[binary,pool]==3.2.3",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "litellm==1.55.9",
    "redis==5.2.1",
    "httpx==0.27.2",
    "prometheus-client==0.21.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "anyio==4.7.0",
]

[tool.setuptools]
packages = ["api", "llm", "store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "integration: requires the docker compose stack and live provider keys",
]
