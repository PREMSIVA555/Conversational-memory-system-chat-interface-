[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-system"
version = "0.1.0"
description = "Persistent conversational-memory layer behind an LLM chat agent"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg[binary,pool]==3.2.3",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "litellm==1.55.9",
    "redis==5.2.1",
    "httpx==0.27.2",
    "prometheus-client==0.21.1",
    "python-dotenv==1.0.1",
    # --- M2: capture graph ---------------------------------------------------
    "langgraph==0.2.60",
    "presidio-analyzer==2.2.355",
    "presidio-anonymizer==2.2.355",
    # Presidio needs a spaCy pipeline. en_core_web_sm (~12 MB) is installed via
    #   python -m spacy download en_core_web_sm
    # rather than pinned here, because spaCy models are not on PyPI.
    # TRADEOFF vs en_core_web_lg (~560 MB): `sm` is weaker at NER-driven
    # entities (PERSON/LOCATION). Every entity M2 must redact -- SSN, email,
    # phone, credit card -- comes from pattern/checksum recognizers that never
    # consult the NER model, so `sm` costs nothing on the required set.
    # Override with PII_SPACY_MODEL if that changes.
    "spacy==3.8.16",
    # --- M8: scheduled maintenance jobs -------------------------------------
    # APScheduler 3.x (not the 4.x pre-release): 3.x is what ships the
    # `SQLAlchemyJobStore` this project uses for a schedule that survives a
    # restart, and its `AsyncIOScheduler` API is stable. See jobs/scheduler.py
    # for why the jobstore URL has to be rewritten to `postgresql+psycopg://`.
    "apscheduler==3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-timeout==2.3.1",
    "anyio==4.7.0",
]

[tool.setuptools]
packages = ["api", "capture", "graphs", "jobs", "llm", "store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "integration: requires the docker compose stack and live provider keys",
]
